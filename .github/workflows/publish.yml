name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      # Authenticates via GitHub OIDC trusted publisher configured on npmjs.com
      # (package Settings -> Trusted Publishers -> GitHub Actions).
      # No NPM_TOKEN secret required.
      - name: Publish
        run: npm publish --provenance
